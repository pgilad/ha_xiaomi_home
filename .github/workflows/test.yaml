name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-rule-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --frozen

      - name: Check rule format with pytest
        run: |
          uv run --frozen pytest -v -m github ./test/check_rule_format.py

      - name: Unit and Home Assistant compatibility tests
        run: |
          uv run --frozen pytest -v -m github ./test/

      - name: Check Python syntax
        run: uv run --frozen python -m compileall -q custom_components test
