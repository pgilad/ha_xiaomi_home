[project]
name = "xiaomi-home-tests"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "aiohttp",
    "construct>=2.10.56",
    "cryptography",
    "homeassistant>=2026.10.1",
    "numpy",
    "paho-mqtt",
    "psutil",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "pytest-dependency",
    "python-slugify",
    "PyYAML",
    "zeroconf",
]

[tool.uv]
package = false
